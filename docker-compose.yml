version: "3.9"
services:
  backend:
    build: ./backend
    container_name: channelcraft-backend
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./backend/generated:/app/generated
      - ./backend/database.db:/app/database.db

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
